project_id = "prosight-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/**", "http://127.0.0.1:8000/**"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.embedding-worker]
verify_jwt = false

[functions.hybrid-search]
verify_jwt = true
