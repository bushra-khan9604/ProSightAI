[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prosight-ai"
version = "0.2.0"
description = "Construction project insights agent reference implementation"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9,<2",
    "fastapi>=0.115,<1",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.10",
    "psycopg-pool==3.2.6",
    "openai-agents>=0.4,<1",
    "argon2-cffi>=23,<26",
    "openpyxl>=3.1,<4",
    "pydantic>=2.10,<3",
    "pypdf>=5,<7",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
prosight = "prosight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prosight = ["schemas/*.json"]
